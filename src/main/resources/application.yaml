# Optional: set a context path for the Admin UI (e.g., "/admin"). Leave commented to use root.
# spring:
#   webflux: {}
# server:
#   servlet:
#     context-path: /admin

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    loggers:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
